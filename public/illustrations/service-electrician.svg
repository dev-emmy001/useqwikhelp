<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="#eff5ff"/>
  <!-- Electrical panel -->
  <rect x="220" y="80" width="120" height="200" rx="16" fill="#0f172a"/>
  <rect x="236" y="100" width="88" height="140" rx="10" fill="#1e5bf7"/>
  <!-- Switches -->
  <rect x="252" y="116" width="56" height="16" rx="8" fill="#eff5ff"/>
  <rect x="252" y="144" width="56" height="16" rx="8" fill="#10b981"/>
  <rect x="252" y="172" width="56" height="16" rx="8" fill="#eff5ff"/>
  <rect x="252" y="200" width="56" height="16" rx="8" fill="#eff5ff"/>
  <!-- Lightning bolt on panel -->
  <polygon points="290,120 278,152 288,152 276,184 304,148 292,148" fill="#ffffff" opacity="0.15"/>
  <!-- Figure body -->
  <circle cx="140" cy="180" r="36" fill="#0f172a"/>
  <rect x="108" y="214" width="64" height="80" rx="20" fill="#1e5bf7"/>
  <!-- Arms -->
  <rect x="172" y="216" width="52" height="20" rx="10" fill="#1e5bf7" transform="rotate(-15 172 226)"/>
  <!-- Hard hat -->
  <ellipse cx="140" cy="152" rx="36" ry="13" fill="#10b981"/>
  <rect x="106" y="148" width="68" height="20" rx="10" fill="#10b981"/>
  <!-- Brim -->
  <rect x="100" y="164" width="80" height="8" rx="4" fill="#0f172a" opacity="0.3"/>
  <!-- Floor line -->
  <rect x="40" y="294" width="320" height="12" rx="6" fill="#0f172a" opacity="0.08"/>
</svg>

