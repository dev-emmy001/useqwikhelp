<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="#eff5ff"/>
  <!-- Pipes -->
  <rect x="60" y="160" width="280" height="32" rx="16" fill="#1e5bf7"/>
  <rect x="180" y="80" width="32" height="120" rx="16" fill="#1e5bf7"/>
  <rect x="180" y="192" width="32" height="100" rx="16" fill="#0f172a"/>
  <!-- Sink bowl -->
  <rect x="100" y="120" width="200" height="56" rx="20" fill="#ffffff"/>
  <rect x="120" y="136" width="160" height="32" rx="12" fill="#eff5ff"/>
  <!-- Wrench -->
  <rect x="220" y="240" width="100" height="24" rx="12" fill="#0f172a" transform="rotate(-40 270 252)"/>
  <circle cx="234" cy="268" r="22" fill="#0f172a"/>
  <circle cx="234" cy="268" r="12" fill="#eff5ff"/>
  <!-- Water drops -->
  <ellipse cx="196" cy="300" rx="8" ry="12" fill="#1e5bf7" opacity="0.6"/>
  <ellipse cx="220" cy="320" rx="6" ry="9" fill="#1e5bf7" opacity="0.4"/>
  <!-- Figure -->
  <circle cx="120" cy="270" r="28" fill="#0f172a"/>
  <rect x="96" y="298" width="48" height="56" rx="16" fill="#1e5bf7"/>
  <!-- Hard hat -->
  <ellipse cx="120" cy="248" rx="28" ry="10" fill="#10b981"/>
  <rect x="96" y="244" width="48" height="14" rx="7" fill="#10b981"/>
</svg>

